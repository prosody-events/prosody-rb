# TEMPORARY: dry-run of the windows-x64 cross-compile only, to validate the
# ERROR_COMMITMENT_MINIMUM workaround on PR #22 without going through a full
# release-please cycle. DELETE this file before merging the PR.

name: TEMP Test Windows Cross-Compile

on:
  push:
    branches:
      - fix-windows-mimalloc-mingw
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-windows-build:
    name: Test windows-x64 cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
          cargo-vendor: true
          cache-version: v1-x64-mingw-ucrt-test

      - name: Cross-compile gem
        uses: prosody-events/actions/cross-gem@add-pre-script-input
        with:
          platform: x64-mingw-ucrt
          ruby-versions: "3.2,3.3,3.4"
          pre-script: >-
            sudo mkdir -p /var/lib/apt/lists/partial &&
            sudo apt-get update -qq &&
            sudo apt-get install -y -q cmake libcurl4-openssl-dev &&
            curl_include=$(dirname $(find /usr/include -name curl.h | head -1)) &&
            sudo ln -sf $curl_include /usr/include/curl &&
            if [[ $CARGO_BUILD_TARGET == *musl* ]]; then
            linker_var="CARGO_TARGET_$(echo $CARGO_BUILD_TARGET | tr a-z- A-Z_)_LINKER" &&
            cc="${!linker_var}" &&
            sysroot=$($cc --print-sysroot) &&
            sudo ln -sf $curl_include ${sysroot}/include/curl; fi &&
            if [[ $CARGO_BUILD_TARGET == *apple-darwin* ]]; then
            export CFLAGS_aarch64_apple_darwin="-fuse-ld=/opt/osxcross/target/bin/aarch64-apple-darwin-ld" &&
            export CXXFLAGS_aarch64_apple_darwin="-fuse-ld=/opt/osxcross/target/bin/aarch64-apple-darwin-ld"; fi &&
            if [[ $CARGO_BUILD_TARGET == *windows-gnu* ]]; then
            export CFLAGS_x86_64_pc_windows_gnu="-DERROR_COMMITMENT_MINIMUM=635"; fi
