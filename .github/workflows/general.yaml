name: Check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      required-work: ${{ steps.rail.outputs.required-work }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore planning evidence
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/planning-evidence
          key: cargo-rail-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.event.before }}
      # The planner rejects a missing evidence directory but accepts an empty one after a cache miss.
      - name: Create the evidence directory
        run: mkdir -p target/planning-evidence
      - id: rail
        uses: loadingalias/cargo-rail-action@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1
        with:
          evidence: target/planning-evidence

  # A separate job records evidence on every push. The routed jobs can skip, and their RUSTFLAGS would not match the plan jobs.
  evidence:
    name: Planning evidence
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: loadingalias/cargo-rail-action/setup@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1
      # Clippy evidence is not recorded: Cargo-Rail 0.30.1 marks it incomplete when the clippy::cargo lints run cargo metadata.
      - name: Record build evidence
        run: >
          cargo rail plan evidence --work cargo.build
          --output target/planning-evidence/cargo.build.json
          -- build --locked --workspace --all-features
      - name: Print evidence bindings
        run: >
          jq '{source_base, cargo_identity, cargo_configuration_identity,
          toolchain_identity, target_identity, platform}'
          target/planning-evidence/*.json
      - name: Save planning evidence
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/planning-evidence
          key: cargo-rail-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  test:
    name: Tests
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ruby') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    services:
      kafka:
        image: apache/kafka:latest
        ports:
          - "9094:9094"
        env:
          KAFKA_NODE_ID: 0
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
      cassandra:
        image: cassandra:latest
        ports:
          - "9042:9042"
        options: >-
          --health-cmd "cqlsh -e 'SELECT cluster_name FROM system.local;'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0
      - name: Install dependencies
        run: bundle install
      - name: Compile extension with debug info
        run: bundle exec rake compile:dev
      - name: Run tests
        run: bundle exec rake spec
        env:
          PROSODY_BOOTSTRAP_SERVERS: localhost:9094
          PROSODY_CASSANDRA_NODES: localhost:9042
          RUST_BACKTRACE: "1"

  types:
    name: Type checks
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'ruby') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Validate signatures and type-check Ruby
        run: bundle exec rake rbs steep

  fmt:
    name: Format
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.fmt') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'taplo') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ruby') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Set up mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install taplo from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: taplo-cli
      - uses: Swatinem/rust-cache@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Enforce Rust formatting
        run: cargo +nightly fmt --check
      - name: Enforce TOML formatting
        run: taplo fmt --check
      - name: Enforce Ruby formatting
        run: bundle exec standardrb

  dependencies:
    name: Dependencies
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'dependency-policy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
      - name: Set up mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false
      - uses: Swatinem/rust-cache@v2
      - name: Install udeps from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-udeps
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0
      - name: Run cargo udeps
        run: cargo +nightly udeps

  docs:
    name: Documentation
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.doc') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Set up mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0
      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc
